[project]
name = "python-service"
version = "0.1.0"
description = "Data core sidecar: Modbus acquisition, telemetry ingest, CSV imports and report generation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    # Remaining runtime dependencies land with the real acquisition work:
    # "pymodbus>=3.7",
    # "pyserial>=3.5",
    # "pyserial-asyncio>=0.6",
    # "pandas>=2.2",
    # "openpyxl>=3.1",
    # "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff==0.16.8",  # pinned: new ruff releases add rules and break lint
    "pip-audit>=2.10",
]

[tool.setuptools.packages.find]
include = ["rpc*", "acquisition*", "storage*", "imports*", "reports*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
